# tgm3-native input bindings (loaded automatically; override with TGM3_BINDINGS=file).
# Lines here replace the built-in default for that action.
#
# Actions: test, quit, fullscreen, p1.* / p2.* with start service coin up down left right b1..b6
# Keys:    SDL key names (A, 1, Up, Space, Return, Escape, F11, Keypad 5 ...), plus
#          Comma Period Slash Semicolon Apostrophe Minus Equals Backslash LeftBracket RightBracket Grave
# Pads:    pad:a pad:b pad:x pad:y pad:back pad:start pad:dpup ... or axes pad:leftx- pad:lefty+
#          (p1's pad:* bindings read the first controller, p2's the second)
# Keyboard bindings only work while the game window has focus.
#
# TGM3 buttons: b1 = A, b2 = B, b3 = C, b4 = D.  Alt+Enter also toggles fullscreen, F12 saves a screenshot.
# This P1 layout matches the one in ../linux/bindings.conf.

test = 9
quit = Escape
fullscreen = F11

p1.start   = 1, pad:start
p1.coin    = 5, pad:back
p1.service = 6
p1.up      = Space, pad:dpup, pad:lefty-
p1.down    = Comma, pad:dpdown, pad:lefty+
p1.left    = Z, pad:dpleft, pad:leftx-
p1.right   = Slash, pad:dpright, pad:leftx+
p1.b1      = X, pad:a
p1.b2      = Period, pad:b
p1.b3      = C, pad:x
p1.b4      = V, pad:y

p2.start   = 2, pad:start
p2.coin    = 7, pad:back
p2.service = 8
p2.up      = I, pad:dpup, pad:lefty-
p2.down    = K, pad:dpdown, pad:lefty+
p2.left    = J, pad:dpleft, pad:leftx-
p2.right   = L, pad:dpright, pad:leftx+
p2.b1      = Q, pad:a
p2.b2      = W, pad:b
p2.b3      = E, pad:x
p2.b4      = R, pad:y
