# jvsd input bindings. Lines here replace the built-in default for that action.
#
# Actions: test, quit, p1.* / p2.* with start service coin up down left right b1..b6
# Codes:   any evdev KEY_* or BTN_* name, or an axis direction like ABS_HAT0X- / ABS_Y+
#          (see `libinput debug-events` or `evtest` for what your device sends).
# Every keyboard/gamepad jvsd can read is used, focused or not, like typex_io's DirectInput.
#
# TGM3 buttons: b1 = A, b2 = B, b3 = C (rotate), b4 = D (Ti's extra rotate).

test = KEY_9
quit = KEY_ESC

p1.start   = KEY_1, BTN_START
p1.coin    = KEY_5, BTN_SELECT
p1.service = KEY_6
p1.up      = KEY_SPACE,    BTN_DPAD_UP,    ABS_HAT0Y-, ABS_Y-
p1.down    = KEY_COMMA,  BTN_DPAD_DOWN,  ABS_HAT0Y+, ABS_Y+
p1.left    = KEY_Z,  BTN_DPAD_LEFT,  ABS_HAT0X-, ABS_X-
p1.right   = KEY_SLASH, BTN_DPAD_RIGHT, ABS_HAT0X+, ABS_X+
p1.b1      = KEY_X, BTN_SOUTH
p1.b2      = KEY_DOT, BTN_EAST
p1.b3      = KEY_V, BTN_WEST
p1.b4      = KEY_C, BTN_NORTH

p2.start   = KEY_2
p2.coin    = KEY_7
p2.service = KEY_8
p2.up      = KEY_I
p2.down    = KEY_K
p2.left    = KEY_J
p2.right   = KEY_L
p2.b1      = KEY_Q
p2.b2      = KEY_W
p2.b3      = KEY_E
p2.b4      = KEY_R
